services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: baas
      MYSQL_USER: baas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: development
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: baas
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: baas
      BAAS_SESSION_SECRET: ${BAAS_SESSION_SECRET:?Set BAAS_SESSION_SECRET in .env}
      BAAS_TOKEN_ENCRYPTION_KEY: ${BAAS_TOKEN_ENCRYPTION_KEY:?Set BAAS_TOKEN_ENCRYPTION_KEY in .env}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - ./api:/workspace/api
      - ./.env:/workspace/.env:ro
      - api_node_modules:/workspace/api/node_modules
    working_dir: /workspace/api
    command: sh -c "pnpm run build && pnpm run db:migrate && pnpm run start:dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      target: development
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    working_dir: /workspace/frontend

volumes:
  mysql_data:
  api_node_modules:
  frontend_node_modules:
